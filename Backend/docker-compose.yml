services:  postgres:    image: pgvector/pgvector:pg17    container_name: pets-veta-postgres    restart: unless-stopped    environment:      POSTGRES_USER: ${POSTGRES_USER:-postgres}      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}      POSTGRES_DB: ${POSTGRES_DB:-pets_veta}    ports:      - "5432:5432"    volumes:      - pets_veta_postgres_data:/var/lib/postgresql/data      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro    healthcheck:      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]      interval: 5s      timeout: 5s      retries: 10      start_period: 10s  backend:    build:      context: .      dockerfile: Dockerfile    container_name: pets-veta-backend    restart: unless-stopped    env_file:      - .env    environment:      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pets_veta}?schema=public      NODE_ENV: development    ports:      - "${PORT:-8000}:${PORT:-8000}"    volumes:      - .:/app      - pets_veta_node_modules:/app/node_modules    depends_on:      postgres:        condition: service_healthy    command: npm run docker:devvolumes:  pets_veta_postgres_data:  pets_veta_node_modules: